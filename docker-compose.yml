services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: intime
      POSTGRES_PASSWORD: intime
      POSTGRES_DB: intime
    ports:
      - "5432:5432"
    volumes:
      - intime_pgdata:/var/lib/postgresql/data

volumes:
  intime_pgdata:
